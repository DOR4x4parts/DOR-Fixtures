<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOR Fixtures — Live product</title>
  <script src="https://cdn.shopify.com/storefront/web-components.js"></script>
  <style>
    :root{--green:#25c443;--black:#000;--charcoal:#1e1e1e;--grey:#bdbdbd;--white:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--charcoal);color:var(--white);font-family:Arial,Helvetica,sans-serif}
    body{overflow-x:hidden}
    .product{padding:clamp(42px,6vw,82px) clamp(20px,4vw,58px);background:var(--charcoal)}
    .grid{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(320px,.98fr);gap:clamp(34px,6vw,84px);align-items:start}
    .media{background:#111;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .media shopify-media{display:block;width:100%}
    .eyebrow{margin:0 0 14px;color:var(--green);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0 0 25px;font-size:clamp(38px,4.7vw,68px);line-height:.94;letter-spacing:-.025em;text-transform:uppercase}
    .description{color:#d7d7d7;font-size:16px;line-height:1.55}
    .description p:first-child{margin-top:0}
    .description p{margin:0 0 16px}
    .description ul{padding-left:21px;margin:14px 0 20px}
    .description li{margin:7px 0}
    .buy{margin-top:32px;padding-top:26px;border-top:2px solid var(--green)}
    .label{margin:0 0 15px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .price{margin:23px 0 17px;font-size:31px;font-weight:800}
    .button{width:100%;border:0;border-radius:0;background:var(--green);color:#000;padding:17px 22px;font-size:16px;font-weight:900;letter-spacing:.055em;text-transform:uppercase;cursor:pointer}
    .button:hover{filter:brightness(1.05)}
    .button:disabled{opacity:.45;cursor:not-allowed}
    .loading{max-width:1360px;margin:0 auto;color:var(--grey);padding:20px 0}
    shopify-variant-selector::part(form){gap:12px}
    shopify-variant-selector::part(label){font-weight:700;color:#fff}
    @media(max-width:760px){
      .product{padding:38px 18px 50px}
      .grid{grid-template-columns:1fr;gap:32px}
      .media{min-height:260px}
      h1{font-size:42px}
      .description{font-size:15px}
    }
  </style>
</head>
<body>
  <shopify-store id="dor-store" store-domain="https://484in8-td.myshopify.com" country="GB" language="en"></shopify-store>
  <section class="product">
    <shopify-context type="product" handle="dor-fixtures-1000x2000-diy-welding-table">
      <template>
        <div class="grid">
          <div class="media">
            <shopify-media query="product.featuredImage" width="900" height="900"></shopify-media>
          </div>
          <div class="details">
            <p class="eyebrow">DOR FIXTURES / LIVE PRODUCT</p>
            <h1><shopify-data query="product.title"></shopify-data></h1>
            <div class="description"><shopify-data query="product.descriptionHtml"></shopify-data></div>
            <div class="buy">
              <p class="label">Choose top thickness</p>
              <shopify-variant-selector></shopify-variant-selector>
              <div class="price"><shopify-money query="product.selectedOrFirstAvailableVariant.price" format="money_with_currency"></shopify-money></div>
              <button class="button" onclick="document.getElementById('dor-store').buyNow(event,{target:'_top'});" shopify-attr--disabled="!product.selectedOrFirstAvailableVariant.availableForSale">Buy now ↗</button>
            </div>
          </div>
        </div>
      </template>
      <div class="loading" shopify-loading-placeholder>Loading live product details…</div>
    </shopify-context>
  </section>
</body>
</html>
